name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I opened the assistant panel and asked a question. I expected a streamed
        answer; the panel stayed empty and nothing appeared in the tool stream.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 4.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: macOS 15.2, arm64

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assistant / chat
        - Agent
        - Local model (llama.cpp / MLX)
        - Model Hub
        - Browsing (tabs, history, bookmarks, downloads)
        - Extensions
        - Voice / reader
        - Settings
        - Window, hotkey or tray
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from the log file. Recovery Mode's "View Logs" button
        opens the folder. Redact any API keys before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem
          required: true
        - label: I removed any API keys or personal data from the details above
          required: true
