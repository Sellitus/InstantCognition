<linearGradient id="db" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0%" stop-color="#FF2486"/><stop offset="12.5%" stop-color="#9B5CFF"/><stop offset="25%" stop-color="#8080C3"/><stop offset="37.5%" stop-color="#00DCFF"/><stop offset="50%" stop-color="#2FB9D6"/><stop offset="62.5%" stop-color="#00DCFF"/><stop offset="75%" stop-color="#8080C3"/><stop offset="87.5%" stop-color="#FF2486"/><stop offset="100%" stop-color="#FF2486"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="edges"><rect width="1280" height="56" fill="url(#fade)"/></mask>
</defs>
